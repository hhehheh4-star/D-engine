name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak zip proyek (kalau ada)
        run: |
          find . -name '*.zip' -not -path './.git/*' -print0 | while IFS= read -r -d '' z; do
            echo "Ekstrak: $z"
            unzip -oq "$z" -d _unzipped
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Cari folder proyek
        id: p
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          echo "Ditemukan: $f"
          echo "dir=$(dirname "$f")" >> $GITHUB_OUTPUT

      - name: Test + build APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DominoEngine-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
